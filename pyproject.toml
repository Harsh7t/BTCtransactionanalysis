[project]
name = "btc-fusion"
version = "0.3.0"
description = "AI-powered monitoring and analysis of Bitcoin transaction traffic (SIH 2026 PS 26146)"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "pydantic", "python-multipart",
  "numpy", "scipy", "scikit-learn", "polars", "pyarrow",
  "lightgbm", "shap", "duckdb", "python-igraph", "gensim",
  "lxml", "ijson", "pyyaml", "jinja2", "maxminddb",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btcfusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
